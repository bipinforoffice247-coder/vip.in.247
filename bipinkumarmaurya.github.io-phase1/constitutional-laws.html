</div>

<div class="container">
<div id="actsList" class="loading">Loading Acts...</div>
</div>
</section>

<footer>

</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL="https://jfstjogeyvkhlhxhiaie.supabase.co";

const SUPABASE_PUBLISHABLE_KEY=
"sb_publishable_XAHKkigfoMkuF88wcAOmCg_BpJ20aGz";

const supabaseClient=
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);

const CATEGORY="Constitution & Constitutional Laws";

async function loadActs(){

const list=document.getElementById("actsList");

try{

const {data,error}=await supabaseClient
.from("bare_acts")
.select("*")
.eq("category",CATEGORY)
.eq("status","published")
.order("created_at",{ascending:false});

if(error)throw error;

if(!data||data.length===0){

list.innerHTML=`
<div class="empty">
<h2>No Published Acts Available</h2>
<p>इस category में अभी कोई Published Act उपलब्ध नहीं है।</p>
</div>`;

return;
}

list.innerHTML="";

data.forEach(act=>{

let pdfUrl="";

if(act.pdf_path){

pdfUrl=supabaseClient
.storage
.from("bare-acts")
.getPublicUrl(act.pdf_path)
.data
.publicUrl;

}

const card=document.createElement("div");
card.className="act-card";

card.innerHTML=`

<h2><a href="act.html?id=${encodeURIComponent(act.id)}" style="color:#d4af37;text-decoration:none">${escapeHTML(act.title || "Untitled Act")}</a></h2>

${
act.content
?`<div class="description">${escapeHTML(act.content)}</div>`
:""
}

${
act.created_at
?`<div class="date">
Published: ${new Date(act.created_at).toLocaleDateString("en-IN")}
</div>`
:""
}

${
pdfUrl
?`<a class="pdf-btn"
href="${pdfUrl}"
target="_blank"
rel="noopener">
📄 Open PDF →
</a>`
:`<div class="date">PDF not available</div>`
}

`;

list.appendChild(card);

});

}catch(error){

console.error(error);

list.innerHTML=`
<div class="error">
<h2>Unable to Load Acts</h2>
<p>Please try again later.</p>
</div>`;

}

}

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

loadActs();
</script>

</body>
