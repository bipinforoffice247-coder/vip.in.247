<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Legal Dictionary | English to Hindi Legal Terms</title><meta name="description" content="Common legal terms with simple Hindi explanations — Bipin Kumar Maurya."><link rel="canonical" href="https://bipinkumarmaurya.github.io/dictionary.html"><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#eee;font-family:Arial,sans-serif;line-height:1.7}header{background:#111;border-bottom:1px solid #d4af37;padding:35px 20px;text-align:center}h1{color:#d4af37;margin:0 0 8px}.container{width:92%;max-width:1050px;margin:auto}.search{padding:25px 0 5px}.search input{width:100%;padding:13px;background:#171717;border:1px solid #555;color:#fff;border-radius:7px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:20px 0 40px}.item{background:#171717;border:1px solid #333;border-radius:8px;padding:17px}.item h2{color:#d4af37;margin:0 0 5px;font-size:20px}.hi{color:#aaa;font-size:14px}nav{text-align:center;background:#0d0d0d;border-bottom:1px solid #333;padding:14px}nav a{color:#d4af37;text-decoration:none;margin:0 8px;font-weight:bold}footer{text-align:center;color:#888;border-top:1px solid #333;padding:25px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><header><h1>📖 Legal Dictionary</h1><p>Common legal terms — आसान हिंदी में</p></header><nav><a href="index.html">Home</a><a href="search.html">Search</a><a href="sections.html">Important Sections</a><a href="articles.html">Articles</a></nav><main class="container"><div class="search"><input id="q" placeholder="Legal term खोजें..." autocomplete="off"></div><section class="grid" id="grid"></section></main><footer>© 2026 Bipin Kumar Maurya. All Rights Reserved.</footer><script>
const terms=[
['Abetment','दुष्प्रेरण','किसी अपराध के किए जाने में उकसाना, सहायता करना या षड्यंत्र के माध्यम से सहयोग करना।'],['Bail','जमानत','कानूनी शर्तों के अधीन हिरासत से अस्थायी/सशर्त रिहाई।'],['Cognizable Offence','संज्ञेय अपराध','ऐसा अपराध जिसमें कानून के अनुसार पुलिस को बिना वारंट गिरफ्तारी और जाँच की शक्ति हो सकती है।'],['Non-Cognizable Offence','असंज्ञेय अपराध','ऐसा अपराध जिसमें पुलिस की जाँच/गिरफ्तारी की शक्ति पर कानून द्वारा अलग शर्तें लागू होती हैं।'],['Bailable Offence','जमानतीय अपराध','ऐसा अपराध जिसमें कानून के अनुसार जमानत का अधिकार उपलब्ध होता है, निर्धारित शर्तों के अधीन।'],['Non-Bailable Offence','गैर-जमानतीय अपराध','ऐसा अपराध जिसमें जमानत स्वतः अधिकार के रूप में उपलब्ध नहीं होती; न्यायालय कानून के अनुसार निर्णय करता है।'],['Mens Rea','दोषपूर्ण मनःस्थिति','अपराध के संबंध में आवश्यक मानसिक तत्व या guilty mind।'],['Actus Reus','अपराध का कृत्य','अपराध का बाहरी/भौतिक कृत्य या आचरण।'],['Res Judicata','पूर्व-न्याय','जिस विषय पर सक्षम न्यायालय अंतिम निर्णय दे चुका हो, उसे उसी पक्षों के बीच फिर से विवादित करने पर रोक।'],['Estoppel','प्रतिषेध','किसी व्यक्ति को उसके पूर्व कथन/आचरण के विपरीत कुछ कहने से कानूनन रोकने का सिद्धांत, जहाँ इसकी शर्तें पूरी हों।'],['Injunction','निषेधाज्ञा','न्यायालय द्वारा किसी कार्य को करने या न करने के लिए दिया गया आदेश।'],['Negligence','उपेक्षा/लापरवाही','वह सावधानी न बरतना जिसकी परिस्थिति में युक्तिसंगत व्यक्ति से अपेक्षा की जाती है।'],['Jurisdiction','अधिकारिता','किसी न्यायालय/प्राधिकरण की किसी मामले को सुनने और निर्णय करने की कानूनी शक्ति।'],['Summons','समन','न्यायालय/प्राधिकरण द्वारा किसी व्यक्ति को उपस्थित होने या किसी कार्य के लिए बुलाने की औपचारिक सूचना।'],['Warrant','वारंट','किसी सक्षम न्यायिक/कानूनी प्राधिकारी द्वारा जारी लिखित आदेश, जैसे गिरफ्तारी या तलाशी के लिए।'],['FIR','प्रथम सूचना रिपोर्ट','संज्ञेय अपराध के संबंध में पुलिस को दी गई सूचना का विधि के अनुसार दर्ज किया जाना।'],['Appeal','अपील','निचली अदालत/प्राधिकरण के निर्णय के विरुद्ध उच्चतर मंच के समक्ष पुनर्विचार/चुनौती की वैधानिक प्रक्रिया।'],['Revision','पुनरीक्षण','उच्च न्यायालय या सक्षम न्यायालय द्वारा अधीनस्थ न्यायालय की कार्यवाही/निर्णय की वैधानिक जाँच।'],['Affidavit','शपथपत्र','शपथ/प्रतिज्ञान के साथ दिया गया लिखित बयान।'],['Limitation','परिसीमा','किसी कानूनी कार्यवाही को शुरू करने के लिए कानून द्वारा निर्धारित समय-सीमा।']
];
const grid=document.getElementById('grid');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function render(){const q=document.getElementById('q').value.toLowerCase().trim();grid.innerHTML=terms.filter(t=>t.join(' ').toLowerCase().includes(q)).map(t=>`<article class="item"><h2>${esc(t[0])}</h2><div class="hi">${esc(t[1])}</div><div>${esc(t[2])}</div></article>`).join('')||'<div>कोई term नहीं मिला।</div>'}document.getElementById('q').addEventListener('input',render);render();
</script></body></html>
